spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/mysql
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:com/example/demo/Mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

alipay.app-id=${ALIPAY_APP_ID}
alipay.merchant-private-key=${ALIPAY_MERCHANT_PRIVATE_KEY}
alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY}
alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do
alipay.sign-type=RSA2
alipay.charset=UTF-8
alipay.format=json

knife4j.enable=true
knife4j.production=false

spring.data.redis.host= 127.0.0.1
spring.data.redis.port= 6379
spring.data.redis.database=0 
spring.data.redis.jedis.pool.max-active = 8
spring.data.redis.jedis.pool.max-idle= 8
spring.data.redis.jedis.pool.min-idle=2
spring.data.redis.jedis.pool.max-wait= 1000

spring.elasticsearch.uris= http://localhost:9200

spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000ms
